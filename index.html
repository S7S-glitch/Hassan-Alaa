        let currentLang = localStorage.getItem("hassan_alaa_lang") || "ar";

        /* =========================================================================

        function setLanguage(lang) {
            if (!I18N[lang]) return;
            currentLang = lang;
            localStorage.setItem("hassan_alaa_lang", lang);

            const t = I18N[lang];
            document.documentElement.lang = lang;
            document.documentElement.dir = t.dir;

            // Update static labels
            document.querySelectorAll("[data-i18n]").forEach(el => {
                const key = el.getAttribute("data-i18n");
                if (t[key]) el.textContent = t[key];
            });

            // Update Name & Footer
            const displayName = lang === "ar" ? CONFIG.name.ar : CONFIG.name.latin;
            document.getElementById("hero-name").textContent = displayName;
            document.getElementById("footer-name").textContent = displayName;

            // Update Education & Location
            document.getElementById("edu-university").textContent = CONFIG.education.university[lang];
            document.getElementById("edu-faculty").textContent = CONFIG.education.faculty[lang];
            document.getElementById("edu-year-badge").textContent = CONFIG.education.year[lang];
            document.getElementById("location-value").textContent = CONFIG.location[lang];

            document.getElementById("phone-value").textContent = CONFIG.contact.phone;
            document.getElementById("email-value").textContent = CONFIG.contact.email;
            document.getElementById("hero-github-btn").href = CONFIG.contact.github;
            document.getElementById("social-github").href = CONFIG.contact.github;
            document.getElementById("social-linkedin").href = CONFIG.contact.linkedin;
            document.getElementById("social-whatsapp").href = CONFIG.contact.whatsapp;

            document.querySelectorAll(".lang-btn").forEach(btn => {
                const active = btn.getAttribute("data-lang") === lang;

                    active
                        ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                        : "text-slate-400 hover:text-slate-200 border border-transparent"
                }`;

            renderProjects();
        }

        function renderProjects() {
            const grid = document.getElementById("projects-grid");
            const t = I18N[currentLang];
            const allProjects = [...customProjects, ...CONFIG.defaultProjects];

            grid.innerHTML = "";
            allProjects.forEach((proj, idx) => {
                const descText = typeof proj.desc === "string" ? proj.desc : (proj.desc[currentLang] || proj.desc.en);
                const card = document.createElement("div");
                card.className = "bento-card rounded-2xl p-6 flex flex-col justify-between gap-5 group";

                const tagsHtml = (proj.tags || [])
                    .map(tag => `<span class="font-mono text-[11px] px-2.5 py-0.5 rounded-md bg-white/[0.04] border border-white/[0.08] text-slate-300">${escapeHTML(tag)}</span>`)
                    .join("");

                card.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex items-center justify-between gap-2">
                            <h3 class="text-base sm:text-lg font-bold text-slate-100 group-hover:text-emerald-300 transition-colors">${escapeHTML(proj.title)}</h3>
                            <span class="font-mono text-xs text-slate-500">0${idx + 1}</span>
                        </div>
                        <p class="text-sm text-slate-400 leading-relaxed">${escapeHTML(descText)}</p>
                    </div>
                    <div class="flex items-center justify-between gap-3 pt-3 border-t border-white/[0.06]">
                        <div class="flex flex-wrap gap-1.5">${tagsHtml}</div>
                        ${proj.github ? `
                            <a href="${escapeHTML(proj.github)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 font-mono text-xs text-cyan-400 hover:text-cyan-300 transition shrink-0">

        // Smooth 3D Tilt on Profile Frame
        const photoCard = document.getElementById("photo-card");
        photoCard.addEventListener("mousemove", (e) => {
            const rect = photoCard.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            photoCard.style.transform = `perspective(900px) rotateX(${y * -10}deg) rotateY(${x * 10}deg)`;
        });
        photoCard.addEventListener("mouseleave", () => {
            photoCard.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg)";
        });

        // Subtle Glowing Pixels inside Photo Frame on Hover
        const photoCanvas = document.getElementById("photo-particles-canvas");
        const pCtx = photoCanvas.getContext("2d");

        function initPhotoParticles() {
            photoCanvas.width = photoCard.clientWidth;
            photoCanvas.height = photoCard.clientHeight;
            photoParticles = Array.from({ length: 22 }, () => ({
                x: Math.random() * photoCanvas.width,
                y: Math.random() * photoCanvas.height,
                vy: -0.25 - Math.random() * 0.45,
                size: Math.random() > 0.5 ? 2.5 : 1.5,
                alpha: Math.random() * 0.55 + 0.2,
                color: Math.random() > 0.5 ? "#10b981" : "#06b6d4"
            }));
        }
        initPhotoParticles();
        window.addEventListener("resize", initPhotoParticles);

        function animatePhotoParticles() {
            pCtx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
            photoParticles.forEach(p => {
                p.y += p.vy;
                if (p.y < -5) {
                    p.y = photoCanvas.height + 5;
                    p.x = Math.random() * photoCanvas.width;
                }
                pCtx.fillStyle = p.color;
                pCtx.globalAlpha = p.alpha;
                pCtx.fillRect(p.x, p.y, p.size, p.size);
            });
            pCtx.globalAlpha = 1;
            requestAnimationFrame(animatePhotoParticles);
        }
        animatePhotoParticles();

        /* =========================================================================
           INTERACTIVE CANVAS BACKGROUND & AMBIENT MOUSE SPOTLIGHT
        ========================================================================= */
        const spotlight = document.getElementById("mouse-spotlight");
        const mouse = { x: -1000, y: -1000 };

        document.addEventListener("mousemove", (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            spotlight.style.left = e.clientX + "px";
            spotlight.style.top = e.clientY + "px";
        });
        document.addEventListener("mouseleave", () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        const bgCanvas = document.getElementById("bg-canvas");
        const ctx = bgCanvas.getContext("2d");
        let particles = [];

        function resizeBgCanvas() {
            bgCanvas.width = window.innerWidth;
            bgCanvas.height = window.innerHeight;
            const count = Math.min(Math.floor((bgCanvas.width * bgCanvas.height) / 18000), 75);
            particles = Array.from({ length: count }, () => ({
                x: Math.random() * bgCanvas.width,
                y: Math.random() * bgCanvas.height,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35,
                size: Math.random() * 2 + 1.2,
                isBit: Math.random() > 0.65,
                bit: Math.random() > 0.5 ? "1" : "0",
                color: Math.random() > 0.5 ? "16, 185, 129" : "6, 182, 212"
            }));
        }
        resizeBgCanvas();
        window.addEventListener("resize", resizeBgCanvas);

        function animateBg() {
            ctx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < 0) p.x = bgCanvas.width;
                if (p.x > bgCanvas.width) p.x = 0;
                if (p.y < 0) p.y = bgCanvas.height;
                if (p.y > bgCanvas.height) p.y = 0;

                const dx = mouse.x - p.x;
                const dy = mouse.y - p.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = 150;

                let alpha = 0.2;
                if (dist < maxDist) {
                    alpha = 0.2 + (1 - dist / maxDist) * 0.55;
                    p.x += dx * 0.0025;
                    p.y += dy * 0.0025;

                    ctx.beginPath();
                    ctx.strokeStyle = `rgba(${p.color}, ${(1 - dist / maxDist) * 0.2})`;
                    ctx.lineWidth = 0.8;
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(mouse.x, mouse.y);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(${p.color}, ${alpha})`;
                if (p.isBit) {
                    ctx.font = "10px 'JetBrains Mono', monospace";
                    ctx.fillText(p.bit, p.x, p.y);
                } else {
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                }
            }
            requestAnimationFrame(animateBg);
        }
        animateBg();

        /* =========================================================================
           UTILITIES (COPY, TOAST, ESCAPE)
        ========================================================================= */
        let toastTimer;
        function showToast(msg) {
            const toast = document.getElementById("toast");
            document.getElementById("toast-text").textContent = msg;
            toast.classList.remove("translate-y-20", "opacity-0");
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add("translate-y-20", "opacity-0");
            }, 2400);
        }

        function copyConfigField(field) {
            const val = CONFIG.contact[field];
            if (!val) return;
            const ta = document.createElement("textarea");
            ta.value = val;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast(I18N[currentLang].copiedMsg);
        }

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        // Init
        document.getElementById("footer-year").textContent = new Date().getFullYear();
        setLanguage(currentLang);
    </script>
